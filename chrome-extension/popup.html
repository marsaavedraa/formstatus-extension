<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormStatus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Login View -->
    <div id="loginView" class="view">
      <div class="header">
        <div class="logo-wrap">
          <img src="icons/fs-icon.png" alt="FormStatus" class="logo">
        </div>
        <h1>FormStatus</h1>
        <p class="subtitle">Monitor your forms</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <button type="submit" id="loginBtn" class="btn btn-primary">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" style="display: none;">Signing in...</span>
        </button>

        <div class="footer-links">
          <a href="https://app.formstatus.co/forgot-password" target="_blank">Forgot password?</a>
          <span class="separator">·</span>
          <a href="https://app.formstatus.co/register" target="_blank">Create account</a>
        </div>
      </form>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="view" style="display: none;">
      <div class="dash-header">
        <div class="dash-brand">
          <img src="icons/fs-icon.png" alt="FormStatus" class="dash-logo">
          <span class="dash-title">FormStatus</span>
        </div>
      </div>

      <div class="user-info">
        <div class="user-avatar">
          <span id="userInitials">U</span>
        </div>
        <div class="user-details">
          <p id="userEmail" class="user-email">user@example.com</p>
          <p id="userStatus" class="user-status">Connected</p>
        </div>
      </div>

      <div class="actions">
        <button id="recordBtn" class="btn btn-record">
          <span class="record-icon">●</span>
          Manual Recording
        </button>
        <div class="secondary-actions">
          <button id="openDashboardBtn" class="btn-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
          </button>
          <span class="separator">·</span>
          <button id="logoutBtn" class="btn-link btn-link-danger">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
      </div>
    </div>

    <!-- Loading View -->
    <div id="loadingView" class="view" style="display: none;">
      <div class="loader-container">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
