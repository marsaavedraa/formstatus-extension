<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FormStatus Options</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
      padding: 32px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    p.sub {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: #111827;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
    }
    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .current {
      margin-top: 16px;
      padding: 10px 14px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 13px;
      color: #4b5563;
    }
    .current code {
      color: #6366f1;
      font-weight: 500;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h1>FormStatus Options</h1>
  <p class="sub">Override the API server. This is for internal use only.</p>

  <label for="envSelect">Environment</label>
  <select id="envSelect">
    <option value="https://app.formstatus.co">Production (app.formstatus.co)</option>
    <option value="https://stg-app.formstatus.co">Staging (stg-app.formstatus.co)</option>
    <option value="https://dev-app.formstatus.co">Develop (dev-app.formstatus.co)</option>
    <option value="http://localhost:8080">Local (localhost:8080)</option>
  </select>

  <div id="status" class="status"></div>

  <div class="current">
    Active API URL: <code id="currentUrl">loading...</code>
  </div>

  <p class="note">Changes take effect immediately. You may need to reload the extension or reopen the popup.</p>

  <script src="options.js"></script>
</body>
</html>
